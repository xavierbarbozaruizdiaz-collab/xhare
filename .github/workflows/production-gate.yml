name: Production Gate

on:
  pull_request:
    branches:
      - main

jobs:
  lockfile-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate lockfiles are updated with manifests
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if echo "$CHANGED" | grep -qx "package.json"; then
            if ! echo "$CHANGED" | grep -qx "package-lock.json"; then
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              if ! git diff --quiet -- package-lock.json; then
                echo "ERROR: package.json changed and package-lock.json is outdated."
                git checkout -- package-lock.json
                exit 1
              fi
            fi
          fi

          if echo "$CHANGED" | grep -qx "mobile-app/package.json"; then
            if ! echo "$CHANGED" | grep -qx "mobile-app/package-lock.json"; then
              pushd mobile-app >/dev/null
              npm install --package-lock-only --ignore-scripts --no-audit --no-fund
              popd >/dev/null
              if ! git diff --quiet -- mobile-app/package-lock.json; then
                echo "ERROR: mobile-app/package.json changed and mobile-app/package-lock.json is outdated."
                git checkout -- mobile-app/package-lock.json
                exit 1
              fi
            fi
          fi

  web-quality:
    runs-on: ubuntu-latest
    needs: lockfile-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npx tsc --noEmit

      - name: Build web
        run: npm run build

  mobile-quality:
    runs-on: ubuntu-latest
    needs: lockfile-guard
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npm run check:ts

      - name: Build-simulate mobile bundle (Android)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          EXPO_PUBLIC_API_BASE_URL: https://example.com
        run: npx expo export --platform android --output-dir dist-ci-export --non-interactive
